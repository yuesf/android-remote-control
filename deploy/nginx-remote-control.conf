# 把信令服务挂在 80 端口的子路径上，供无法放行 8787 的网络使用。
# 通过 Host 精确匹配 IP，避免落到现有站点的 default_server 或 301 跳转。
#
# 手机端填写：http://__PUBLIC_IP__/rc
# 该文件放在 /etc/nginx/conf.d/ 下，由 nginx.conf 的 include 载入（http 上下文）。

map $http_upgrade $rc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __PUBLIC_IP__;

    # 只暴露信令接口，其余路径一律 404，避免变成通用反代
    location = /rc {
        return 301 /rc/;
    }

    location /rc/ {
        # 尾斜杠表示剥掉 /rc 前缀：/rc/ws -> /ws
        proxy_pass http://127.0.0.1:8787/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rc_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接：默认 60s 会被 nginx 主动掐断，表现为随机会话中断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
